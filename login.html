<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인 · Nuvistage</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/fonts.css"></head><body class="auth-page"><main class="auth-card"><a class="auth-brand" href="/login">Nuvistage <span>STUDIO</span></a><div class="kicker">LOCAL DISPLAY WORKSPACE</div><h1 id="authTitle">관리자 로그인</h1><p class="muted" id="authDescription">워크스페이스를 안전하게 관리하세요.</p><form id="authForm"><label class="field">관리자 아이디<input id="username" name="username" autocomplete="username" required minlength="2" maxlength="60"></label><label class="field">비밀번호<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></label><label class="field hidden" id="confirmField">비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" maxlength="256"></label><p id="authError" class="form-error" role="alert"></p><button class="btn primary" id="authSubmit" type="submit">로그인</button></form><div class="auth-note">관리자 로그인과 출력용 플레이어 연결은 별도입니다.<br>Player는 최초 등록 후 장치 토큰으로 자동 연결합니다.</div></main><script type="module" src="/auth.js"></script></body></html>
